[package]
name = "azulejo-preview"
description = "Preview tiles: classify files, render markdown and code to HTML, watch for changes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
comrak = { version = "0.59", default-features = false }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
url = "2"

[dev-dependencies]
tempfile = "3"
