[package]
name = "azulejo-cli"
description = "azj, the Azulejo command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "azulejo_cli"
path = "src/lib.rs"

[[bin]]
name = "azj"
path = "src/main.rs"

[dependencies]
azulejo-api.workspace = true
azulejo-protocol.workspace = true
serde_json.workspace = true

[dev-dependencies]
azulejo-config.workspace = true
azulejo-daemon.workspace = true
azulejo-engine.workspace = true
