[package]
name = "azulejo-engine"
description = "Core state machine, persistence and config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
azulejo-model.workspace = true
azulejo-protocol.workspace = true
azulejo-herdr.workspace = true
azulejo-preview.workspace = true
azulejo-files.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "live"
path = "tests/live.rs"
