# Azulejo default keymap. Rationale: docs/keybindings.md.
#
# Every binding here is overridable: ~/.config/azulejo/config.toml takes the
# same [keys.*] and [prefix] shape, and a user entry replaces the default for
# that action only ("" unbinds it).
#
# Derived from the maintainer's herdr bindings (~/.config/herdr/config.toml):
#   alt       = tiles      (focus, swap, resize, zoom, close, layout rules)
#   cmd       = workspaces, tabs, app
#   ctrl+cmd  = new tiles  (splits)
# No default chord is a bare ctrl+<letter>, so shells and TUIs keep every
# control key.
#
# Shape (the F25 config file uses the same shape under [keys]):
#   action = "chord"                one chord
#   action = ["chord", "chord"]     several chords
#   action = "mod+1..8"             indexed binding; the action gets the index
#   action = ""                     explicitly unbound
# Sections:
#   [keys.macos] / [keys.linux]     per platform
#   [keys.<platform>.<context>]     only in that context; wins over the
#                                   platform section there. Tile kinds while
#                                   focused (terminal | browser | preview |
#                                   files), or a mode with the keyboard:
#                                   palette (quick open), find_bar (a find bar or
#                                   the files filter), resize (resize mode,
#                                   which ignores every other binding)
#   Actions that only work in one context (palette_next, browser_back, …)
#   land there even when written in [keys] or [keys.<platform>].
#   [prefix] / [prefix.keys]        optional herdr-style prefix mode
# Chords match the physical key, not the shifted character: "ctrl+shift+minus"
# stays "minus", never "underscore".
#
# External keyboard remappers can intercept chords before the app.
# Exclude dev.azulejo.Azulejo from conflicting global window-movement rules,
# or override the corresponding bindings in your local config.

[keys.macos]
# Tiles: focus, swap, resize (herdr: alt+hjkl, alt+shift+hjkl, ctrl+alt+shift+hjkl)
focus_tile_left  = "alt+h"
focus_tile_down  = "alt+j"
focus_tile_up    = "alt+k"
focus_tile_right = "alt+l"
swap_tile_left   = "alt+shift+h"
swap_tile_down   = "alt+shift+j"
swap_tile_up     = "alt+shift+k"
swap_tile_right  = "alt+shift+l"
resize_tile_left  = "ctrl+alt+shift+h"
resize_tile_down  = "ctrl+alt+shift+j"
resize_tile_up    = "ctrl+alt+shift+k"
resize_tile_right = "ctrl+alt+shift+l"
resize_mode = "ctrl+alt+r"            # sticky hjkl until esc (herdr prefix+r)
zoom_tile   = "alt+shift+m"           # not cmd+m (Minimise), not alt+m (Hammerspoon)
close_tile  = "alt+w"                 # detaches the herdr pane (F14); kill is palette-only
cycle_tile_next     = "alt+]"         # herdr prefix+tab
cycle_tile_previous = "alt+["

# New tiles (herdr: ctrl+cmd+t via tall.py, ctrl+cmd+shift+t, prefix+v)
split_auto  = "ctrl+cmd+t"            # "tall" rule: master left, stack right, append to stack
split_down  = "ctrl+cmd+shift+t"
split_right = "ctrl+cmd+v"

# Master-stack rules (herdr: tall.py promote / rotate / equalize). In a
# dynamic Tile tab (the default for new tabs, ADR 0010) promote moves the tile
# to the front of the order and equalize resets the stack sizes.
promote_tile    = "alt+enter"         # to master
rotate_layout   = "alt+o"             # master left <-> master on top
equalize_layout = "alt+shift+e"       # even out the stack

# Dynamic layouts (ADR 0010): Bismuth's Meta chords on the alt layer.
cycle_layout_next      = "alt+backslash"         # tile -> monocle -> three_column
cycle_layout_previous  = "alt+shift+backslash"
toggle_layout_tile     = "alt+t"                 # bash/zsh lose alt+t (transpose words) in tiles
toggle_layout_monocle  = "alt+z"                 # alt+m is Hammerspoon's, alt+shift+m is zoom
toggle_layout_manual   = "alt+shift+t"           # freeze to a split tree, or restore it
increase_masters       = "alt+equal"
decrease_masters       = "alt+minus"
grow_master_area       = "alt+shift+equal"
shrink_master_area     = "alt+shift+minus"
move_position_next     = "alt+shift+bracketright"
move_position_previous = "alt+shift+bracketleft"
rotate_part            = "alt+shift+o"           # several masters side by side <-> stacked

# Workspaces (herdr: cmd+t, cmd+1..9, alt+0). cmd+w closes the workspace and
# cmd+shift+w the tab, like cmd+t / cmd+shift+t open them. Closing detaches:
# herdr keeps the panes running (F14).
new_workspace         = "cmd+t"
switch_workspace      = "cmd+1..8"
switch_workspace_last = "cmd+9"       # the last one in the sidebar, as cmd+9 in a browser
last_workspace        = "alt+0"       # the previously active one (herdr's last.py space)
close_workspace       = "cmd+w"

# Tabs (herdr: cmd+shift+t, ctrl+tab; prefix+1..9)
new_tab         = "cmd+shift+t"
switch_tab      = "ctrl+1..8"
switch_tab_last = "ctrl+9"            # the last tab in order; last_tab (previously active) is palette-only
next_tab        = "ctrl+tab"
previous_tab    = "ctrl+shift+tab"
close_tab       = "cmd+shift+w"

# App
quick_open      = "cmd+k"             # one menu: commands + workspaces/tabs/tiles (">" commands, "@" jump)
# command_palette (opens quick open with ">") and goto (with "@") are unbound
# by default; bind them here to get cmd+shift+p / cmd+p back.
find            = "cmd+f"             # scrollback search via herdr in terminals, page find in browsers and previews, the files filter
new_window      = "cmd+n"
open_config     = "cmd+,"
# The app menu's own chords; the menu bar shows whatever is bound here.
quit            = "cmd+q"
hide            = "cmd+h"
hide_others     = "alt+cmd+h"
minimize        = "cmd+m"
# Deliberately unbound: cmd+` (macOS window cycling). cmd+k takes over
# Ghostty's clear_screen; ctrl+l still clears (docs/keybindings.md). Text
# fields keep AppKit's editing keys (cmd+a/c/v/x/z) through the Edit menu.

[keys.macos.terminal]
toggle_sidebar    = "cmd+a"           # herdr binding; terminal-only so cmd+a stays select-all elsewhere
send_herdr_prefix = "ctrl+b"          # typed twice so herdr's attach client never sees ctrl+b q (detach)
# take_over: Take over / Take back on a read-only terminal; unbound (the button)

[keys.macos.browser]
browser_focus_address      = "cmd+l"
browser_reload             = "cmd+r"
browser_reload_from_origin = "cmd+shift+r"
browser_back               = "cmd+["
browser_forward            = "cmd+]"
browser_stop               = "cmd+period"
browser_zoom_in            = "cmd+equal"
browser_zoom_out           = "cmd+minus"
browser_zoom_reset         = "cmd+0"
browser_inspector          = "alt+cmd+i"

[keys.macos.preview]
preview_toggle_source = "alt+cmd+u"   # Preview | Source (Safari's View Source chord)

[keys.macos.files]
# Files tiles and the sidebar's Files view, while the list has the keyboard.
# left/right stay AppKit's (collapse/expand); the filter field is [find_bar].
files_down          = ["j", "down"]
files_up            = ["k", "up"]
files_open          = "enter"         # open in a preview beside, or open/close the folder
files_expand        = "l"             # expand the folder, or open the file
files_collapse      = "h"             # collapse the folder, or go to the parent
files_open_external = "cmd+down"      # default app (folders expand)
files_parent        = "cmd+up"
files_quick_look    = "space"
files_filter        = "/"
files_toggle_hidden = "."
files_leave         = "escape"        # sidebar Files view: back to the tiles

[keys.macos.palette]
# Quick open (cmd+k). Typing goes to its field; ">" and "@" at the start of
# the query scope it (text, not keys). Global chords still run quick_open,
# command_palette and goto; anything else is typing.
palette_close     = "escape"
palette_run       = "enter"
palette_next      = ["down", "ctrl+n", "ctrl+j"]
palette_previous  = ["up", "ctrl+p", "ctrl+k"]
palette_page_down = "pagedown"
palette_page_up   = "pageup"
palette_complete  = "tab"             # complete the query with the selected row

[keys.macos.find_bar]
# A find bar's field (terminal, browser, preview), or the files filter. Other
# chords resolve without the tile's context here, so cmd+a selects the query.
find_next     = ["enter", "cmd+g"]
find_previous = ["shift+enter", "cmd+shift+g"]
find_close    = "escape"

[keys.macos.resize]
# Resize mode (resize_mode, ctrl+alt+r): only these work; other keys are
# swallowed until resize_mode_exit. Any action can be bound here.
resize_tile_left  = ["h", "left"]
resize_tile_down  = ["j", "down"]
resize_tile_up    = ["k", "up"]
resize_tile_right = ["l", "right"]
resize_mode_exit  = ["escape", "enter"]

[keys.linux]
# cmd maps to Super, so the macOS chords carry over one for one. The window
# manager sees Super first and wins any clash (GNOME: super+1..9, super+a,
# super+p, super+n). If yours does, free those chords in the WM or use the
# ctrl+shift layout in docs/keybindings.md ("Linux alternative").
focus_tile_left  = "alt+h"
focus_tile_down  = "alt+j"
focus_tile_up    = "alt+k"
focus_tile_right = "alt+l"
swap_tile_left   = "alt+shift+h"
swap_tile_down   = "alt+shift+j"
swap_tile_up     = "alt+shift+k"
swap_tile_right  = "alt+shift+l"
resize_tile_left  = "ctrl+alt+shift+h"
resize_tile_down  = "ctrl+alt+shift+j"
resize_tile_up    = "ctrl+alt+shift+k"
resize_tile_right = "ctrl+alt+shift+l"
resize_mode = "ctrl+alt+r"
zoom_tile   = "alt+shift+m"
close_tile  = "alt+w"
cycle_tile_next     = "alt+]"
cycle_tile_previous = "alt+["

split_auto  = "ctrl+super+t"
split_down  = "ctrl+super+shift+t"
split_right = "ctrl+super+v"

promote_tile    = "alt+enter"
rotate_layout   = "alt+o"
equalize_layout = "alt+shift+e"

cycle_layout_next      = "alt+backslash"
cycle_layout_previous  = "alt+shift+backslash"
toggle_layout_tile     = "alt+t"
toggle_layout_monocle  = "alt+z"
toggle_layout_manual   = "alt+shift+t"
increase_masters       = "alt+equal"
decrease_masters       = "alt+minus"
grow_master_area       = "alt+shift+equal"
shrink_master_area     = "alt+shift+minus"
move_position_next     = "alt+shift+bracketright"
move_position_previous = "alt+shift+bracketleft"
rotate_part            = "alt+shift+o"

new_workspace         = "super+t"
switch_workspace      = "super+1..8"
switch_workspace_last = "super+9"
last_workspace        = "alt+0"
close_workspace       = "super+w"

new_tab         = "super+shift+t"
switch_tab      = "ctrl+1..8"
switch_tab_last = "ctrl+9"
next_tab        = "ctrl+tab"
previous_tab    = "ctrl+shift+tab"
close_tab       = "super+shift+w"

quick_open      = "super+k"
find            = "super+f"
new_window      = "super+n"
open_config     = "super+comma"
quit            = "ctrl+shift+q"      # GTK terminals' chord; hide/minimize are the WM's

[keys.linux.terminal]
toggle_sidebar    = "super+a"         # terminal-only, like macOS
send_herdr_prefix = "ctrl+b"

[keys.linux.browser]
# Linux browser conventions here, not super: super+l locks the screen.
browser_focus_address      = "ctrl+l"
browser_reload             = "ctrl+r"
browser_reload_from_origin = "ctrl+shift+r"
browser_back               = "alt+left"
browser_forward            = "alt+right"
browser_stop               = ""        # no Linux convention besides escape, which pages need
browser_zoom_in            = "ctrl+equal"
browser_zoom_out           = "ctrl+minus"
browser_zoom_reset         = "ctrl+0"
browser_inspector          = "ctrl+shift+i"

[keys.linux.preview]
preview_toggle_source = "ctrl+u"      # View Source in Linux browsers

[keys.linux.files]
files_down          = ["j", "down"]
files_up            = ["k", "up"]
files_open          = "enter"
files_expand        = "l"
files_collapse      = "h"
files_open_external = "alt+down"      # GNOME Files' chords
files_parent        = "alt+up"
files_quick_look    = "space"
files_filter        = "/"
files_toggle_hidden = "."
files_leave         = "escape"

[keys.linux.palette]
palette_close     = "escape"
palette_run       = "enter"
palette_next      = ["down", "ctrl+n", "ctrl+j"]
palette_previous  = ["up", "ctrl+p", "ctrl+k"]
palette_page_down = "pagedown"
palette_page_up   = "pageup"
palette_complete  = "tab"

[keys.linux.find_bar]
find_next     = ["enter", "ctrl+g"]
find_previous = ["shift+enter", "ctrl+shift+g"]
find_close    = "escape"

[keys.linux.resize]
resize_tile_left  = ["h", "left"]
resize_tile_down  = ["j", "down"]
resize_tile_up    = ["k", "up"]
resize_tile_right = ["l", "right"]
resize_mode_exit  = ["escape", "enter"]

# Optional prefix mode: mirrors herdr's prefix sequences for everything without
# a direct chord. Off by default. The prefix is cmd+b (super+b on Linux),
# never ctrl+b: Azulejo would have to swallow the shell's ctrl+b, or pass it on
# to the attach client, where ctrl+b q detaches the tile.
[prefix]
enabled = false
key.macos = "cmd+b"
key.linux = "super+b"

[prefix.keys]
focus_tile_left  = "prefix+h"
focus_tile_down  = "prefix+j"
focus_tile_up    = "prefix+k"
focus_tile_right = "prefix+l"
cycle_tile_next     = "prefix+tab"
cycle_tile_previous = "prefix+shift+tab"
split_right      = "prefix+v"
split_down       = "prefix+minus"
close_tile       = "prefix+x"
kill_tile        = "prefix+shift+k"   # Azulejo-only: close tile AND kill the herdr pane
zoom_tile        = "prefix+z"
resize_mode      = "prefix+r"
new_tab          = "prefix+c"
next_tab         = "prefix+n"
previous_tab     = "prefix+p"
switch_tab       = "prefix+1..9"
close_tab        = "prefix+shift+x"
rename_tab       = "prefix+shift+t"
rename_tile      = "prefix+shift+p"
new_workspace    = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace  = "prefix+shift+d"
goto             = ["prefix+w", "prefix+g"]   # quick open with "@"
toggle_sidebar   = "prefix+b"
edit_scrollback  = "prefix+e"
find             = "prefix+["         # herdr copy mode -> Azulejo scrollback search
command_palette  = "prefix+?"         # herdr help -> quick open with ">" lists every binding
