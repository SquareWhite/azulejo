[workspace]
resolver = "3"
members = ["core/crates/*", "apps/linux"]
# The Linux shell needs GTK4, which isn't installed on macOS dev machines.
# `cargo build` at the root builds only the core; the Linux shell builds with
# `cargo build -p azulejo-linux` (see `just linux`).
default-members = ["core/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.99"

[workspace.dependencies]
azulejo-model = { path = "core/crates/model" }
azulejo-protocol = { path = "core/crates/protocol" }
azulejo-herdr = { path = "core/crates/herdr" }
azulejo-engine = { path = "core/crates/engine" }
azulejo-api = { path = "core/crates/api" }
azulejo-config = { path = "core/crates/config" }
azulejo-daemon = { path = "core/crates/daemon" }
azulejo-files = { path = "core/crates/files" }
azulejo-hints = { path = "core/crates/hints" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
ulid = "3"
proptest = "1.12"

# ⌘S detection runs on the main thread when the overlay opens: keep it fast
# in debug builds too (the dev app links the debug core).
[profile.dev.package.azulejo-hints]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
