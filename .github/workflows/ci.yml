name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: just build
      - run: just test
      - run: just lint
      - run: just mac

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4, libadwaita, WebKitGTK and VTE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libvte-2.91-gtk4-dev
      - uses: jdx/mise-action@v2
        with:
          install_args: rust just
      - uses: Swatinem/rust-cache@v2
      - run: just build
      - run: just test
      - run: just lint
      - run: just linux
